name: Deploying

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
    
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit testing
        run: pnpm vitest run

      - name: Run browser testing
        run: pnpm playwright test --pass-with-no-tests

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

      # The wiki, as a Jekyll site in the minimal theme, under /docs/ beside
      # Storybook. docs/ is generated from the estate's tools/wikis by
      # tools/wikis/pages.py; Pages decides the path's spelling (/Leo/), so
      # the base URL is read from it rather than written down.
      - name: Read the Pages path
        id: pages
        uses: actions/configure-pages@v5

      - name: Point the docs at their path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          printf 'baseurl: "%s/docs"\n' "$BASE_PATH" >> docs/_config.yml

      - name: Build the docs
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: storybook-static/docs

      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static


  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
