name: Versioning

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  coverage:
    name: Update Badges 
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository with full history so we can push
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # pnpm is the version package.json pins (packageManager); Node 22 is
      # what Vite 8 and Storybook 10 want.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # 4️⃣ Install dependencies, so Prettier and ESLint report the versions
      # the project uses rather than whatever npx downloads.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 5️⃣ Setup Git author info
      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # 3️⃣ Update version badge in README.md
      - name: Update Leo Badge with Version
        run: |
          LEO_VERSION=$(node -p "require('./package.json').version")
          echo "Updating README.md with version: $LEO_VERSION"
          sed -i -E "s#(!\[Version\]\(https://img.shields.io/badge/Version-)[0-9]+\.[0-9]+\.[0-9]+(-blue\))#\1${LEO_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Version\]\(https://img.shields.io/badge/Version-)[0-9]+\.[0-9]+\.[0-9]+(-blue\))#\1${LEO_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: $LEO_VERSION"

      # 4️⃣ Update version badge in README.md
      - name: Update Storybook Badge with Version
        run: |
          STORYBOOK_VERSION=$(node -p "let v=require('./package.json').devDependencies.storybook.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md with version: $STORYBOOK_VERSION"
          sed -i -E "s#(!\[Storybook\]\(https://img.shields.io/badge/Storybook-)[^ ]+(-FF4785\?style=flat&logo=storybook&logoColor=FF4785\))#\1${STORYBOOK_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Storybook\]\(https://img.shields.io/badge/Storybook-)[^ ]+(-FF4785\?style=flat&logo=storybook&logoColor=FF4785\))#\1${STORYBOOK_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: $STORYBOOK_VERSION"

      # 6️⃣ Update Vitest Badge
      - name: Update Vitest Badge with Version
        run: |
          VITEST_VERSION=$(node -p "let v=require('./package.json').devDependencies.vitest.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md with Vitest version: $VITEST_VERSION"
          sed -i -E "s#(!\[Vitest\]\(https://img.shields.io/badge/Vitest-)[^ ]+(-informational\?style=flat&logo=vite&color=646CFF\))#\1${VITEST_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Vitest\]\(https://img.shields.io/badge/Vitest-)[^ ]+(-informational\?style=flat&logo=vite&color=646CFF\))#\1${VITEST_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: $VITEST_VERSION"

      # 6️⃣ Update Pnpm Badge
      - name: Update Pnpm Badge with Version
        run: |
          PNPM_VERSION=v$(pnpm -v)
          echo "Updating README.md with Pnpm version: $PNPM_VERSION"
          sed -i -E "s#(!\[Pnpm\]\(https://img.shields.io/badge/Pnpm-)[^ ]+(-informational\?style=flat&logo=pnpm&color=F9AD00\))#\1${PNPM_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Pnpm\]\(https://img.shields.io/badge/Pnpm-)[^ ]+(-informational\?style=flat&logo=pnpm&color=F9AD00\))#\1${PNPM_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: $PNPM_VERSION"

      # 6️⃣ Update Pnpm Badge
      - name: Update npm Badge with Version
        run: |
          NPM_VERSION=v$(npm -v)
          echo "Updating README.md with npm version: $NPM_VERSION"
          sed -i -E "s#(!\[npm\]\(https://img.shields.io/badge/npm-)[^ ]+(-informational\?style=flat&logo=npm&color=CC3534\))#\1${NPM_VERSION}\2#g" README.md
          sed -i -E "s#(!\[npm\]\(https://img.shields.io/badge/npm-)[^ ]+(-informational\?style=flat&logo=npm&color=CC3534\))#\1${NPM_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: $NPM_VERSION"

      # 6️⃣ Update Vite Badge
      - name: Update Vite Badge with Version
        run: |
          VITE_VERSION=$(node -p "let v=require('./package.json').devDependencies.vite.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md with Vite version: $VITE_VERSION"
          sed -i -E "s#(!\[Vite\]\(https://img.shields.io/badge/Vite-)[^ ]+(-informational\?style=flat&logo=vite&color=646CFF\))#\1${VITE_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Vite\]\(https://img.shields.io/badge/Vite-)[^ ]+(-informational\?style=flat&logo=vite&color=646CFF\))#\1${VITE_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: $VITE_VERSION"

      # 6️⃣ Update Node.js Badge
      - name: Update Node.js Badge with Version
        run: |
          NODE_VERSION=$(node -v)
          echo "Updating README.md with Node.js version: $NODE_VERSION"
          sed -i -E "s#(!\[Node\.js\]\(https://img.shields.io/badge/Node\.js-)[^ ]+(-informational\?style=flat&logo=nodedotjs&color=3c873a\))#\1${NODE_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Node\.js\]\(https://img.shields.io/badge/Node\.js-)[^ ]+(-informational\?style=flat&logo=nodedotjs&color=3c873a\))#\1${NODE_VERSION}\2#g" CONTRIBUTING.md
          grep "Node.js" README.md || true

      # 6️⃣ Update TypeScript Badge
      - name: Update TypeScript Badge with Version
        run: |
          TS_VERSION=$(node -p "let v=require('./package.json').devDependencies.typescript.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md with TypeScript version: $TS_VERSION"
          sed -i -E "s#(!\[TypeScript\]\(https://img.shields.io/badge/Typescript-)[^ ]+(-informational\?style=flat&logo=typescript&color=3178c6\))#\1${TS_VERSION}\2#g" README.md
          sed -i -E "s#(!\[TypeScript\]\(https://img.shields.io/badge/Typescript-)[^ ]+(-informational\?style=flat&logo=typescript&color=3178c6\))#\1${TS_VERSION}\2#g" CONTRIBUTING.md
          grep "Typescript" README.md || true

      # Update Playwright Badge with Custom SVG
      - name: Update Playwright Badge with Version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "let v=require('./package.json').devDependencies.playwright.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md and CONTRIBUTING.md with Playwright version: $PLAYWRIGHT_VERSION"
          BASE64_SVG="..."
          sed -i -E "s#(src=\"https://img.shields.io/badge/Playwright-)[^-\"]+(-1E8D22\?style=flat&logo=)[^\"]+#\1${PLAYWRIGHT_VERSION}\2data:image/svg+xml;base64,${BASE64_SVG}#g" README.md
          sed -i -E "s#(src=\"https://img.shields.io/badge/Playwright-)[^-\"]+(-1E8D22\?style=flat&logo=)[^\"]+#\1${PLAYWRIGHT_VERSION}\2data:image/svg+xml;base64,${BASE64_SVG}#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: Playwright $PLAYWRIGHT_VERSION"

      # Update Prettier Badge
      - name: Update Prettier Badge with Version
        run: |
          PRETTIER_VERSION=$(npx prettier --version)
          echo "Updating README.md with Prettier version: $PRETTIER_VERSION"
          sed -i -E "s#(!\[Prettier\]\(https://img.shields.io/badge/Prettier-)[^ ]+(-F7B93E\?style=flat&logo=prettier&logoColor=white\))#\1v${PRETTIER_VERSION}\2#g" README.md
          sed -i -E "s#(!\[Prettier\]\(https://img.shields.io/badge/Prettier-)[^ ]+(-F7B93E\?style=flat&logo=prettier&logoColor=white\))#\1v${PRETTIER_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: Prettier v$PRETTIER_VERSION"

          # Update ESLint Badge
      - name: Update ESLint Badge with Version
        run: |
          ESLINT_VERSION=$(npx eslint --version)
          echo "Updating README.md with ESLint version: $ESLINT_VERSION"
          sed -i -E "s#(!\[ESLint\]\(https://img.shields.io/badge/ESLint-)[^ ]+(-4B32C3\?style=flat&logo=eslint&logoColor=white\))#\1${ESLINT_VERSION}\2#g" README.md
          sed -i -E "s#(!\[ESLint\]\(https://img.shields.io/badge/ESLint-)[^ ]+(-4B32C3\?style=flat&logo=eslint&logoColor=white\))#\1${ESLINT_VERSION}\2#g" CONTRIBUTING.md
          echo "Updated README.md and CONTRIBUTING.md: ESLint $ESLINT_VERSION"


      - name: Update Tailwind CSS Badge
        run: |
          TAILWIND_VERSION=$(node -p "let v=require('./package.json').devDependencies.tailwindcss.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md with Tailwind CSS version: $TAILWIND_VERSION"
          # Use a more robust regex and overwrite in-place
          sed -i -E "s#(\[!\[Tailwind CSS\]\(https://img.shields.io/badge/Tailwind%20CSS-)[^?-]+#\1${TAILWIND_VERSION}#g" README.md
          sed -i -E "s#(\[!\[Tailwind CSS\]\(https://img.shields.io/badge/Tailwind%20CSS-)[^?-]+#\1${TAILWIND_VERSION}#g" CONTRIBUTING.md
          echo "Updated README.md:"
          grep "Tailwind" README.md || true


      # 6️⃣ Update React.js Badge with Version
      - name: Update React.js Badge with Version
        run: |
          REACT_VERSION=$(node -p "let v=require('./package.json').devDependencies.react.replace(/^\^/, ''); 'v'+v")
          echo "Updating README.md with React version: $REACT_VERSION"
          sed -i -E "s#(!\[React\.js\]\(https://img.shields.io/badge/React\.js-)[^ ]+(-61DAFB\?logo=react&logoColor=white\))#\1${REACT_VERSION}\2#g" README.md
          sed -i -E "s#(!\[React\.js\]\(https://img.shields.io/badge/React\.js-)[^ ]+(-61DAFB\?logo=react&logoColor=white\))#\1${REACT_VERSION}\2#g" CONTRIBUTING.md
          grep "React" README.md || true


  
      # 7️⃣ Commit & push the updated badge only if there are changes
      - name: Commit and push badge update
        run: |
          git add README.md CONTRIBUTING.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version badge [skip ci]"
            # Testing and Versioning both commit badges for the same push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi
