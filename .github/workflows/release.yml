# Generated by tools/ci/generate.py in roola-xyz/Estate. Change it there, not here.
name: Release
run-name: "Release · ${{ github.sha }}"

# A push to main asks the estate to build and deploy what this
# repository goes into: accounts, adverts, cloud, control, everything, helix, news, policies, politicise, support. The estate's Containers workflow
# (roola-xyz/Estate .github/workflows/containers.yml) builds those images and
# rolls them out to the cluster with `helm upgrade --install`.
#
# Needs secret ESTATE_DISPATCH_TOKEN: a fine-grained token with Contents:
# read and write on roola-xyz/Estate (an organisation secret, shared by every
# repository). Without it this says so and stops.
on:
  push:
    branches: [main]
    # Nothing that goes into an image: no rebuild for a workflow or a README.
    paths-ignore: ['.github/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Ask the estate to deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.ESTATE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ESTATE_DISPATCH_TOKEN is not set, so the estate was not asked to deploy."
            exit 0
          fi
          gh api repos/roola-xyz/Estate/dispatches \
            -f event_type=release \
            -f 'client_payload[sites]=accounts adverts cloud control everything helix news policies politicise support' \
            -f 'client_payload[from]=${{ github.repository }}@${{ github.sha }}'
