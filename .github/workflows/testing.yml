name: Testing

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  coverage:
    name: Generate Coverage and Update Badge
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository with full history so we can push
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      # pnpm is the version package.json pins (packageManager); Node 22 is
      # what Vite 8 and Storybook 10 want.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣ Install Playwright browsers
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      # 6️⃣ Run tests with coverage
      - name: Run tests with coverage
        run: pnpm vitest run --coverage

      # 7️⃣ Upload coverage report as artifact (optional)
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

      # 8️⃣ Setup Git author info
      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # 9️⃣ Update coverage badge in README.md
      - name: Update Coverage Badge
        run: |
          COVERAGE=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Coverage: $COVERAGE%"
          sed -i -E "s#(!\[Code_Coverage\]\(https://img.shields.io/badge/Code_Coverage-)[0-9]+%25-brightgreen#\1${COVERAGE}%25-brightgreen#g" README.md
          sed -i -E "s#(!\[Code_Coverage\]\(https://img.shields.io/badge/Code_Coverage-)[0-9]+%25-brightgreen#\1${COVERAGE}%25-brightgreen#g" CONTRIBUTING.md
          echo "Updated README.md with new coverage"
          grep "Code_Coverage" README.md

      # 🔟 Commit & push the updated badge only if there are changes
      - name: Commit and push badge update
        run: |
          git add README.md CONTRIBUTING.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version badge [skip ci]"
            # Testing and Versioning both commit badges for the same push.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi
